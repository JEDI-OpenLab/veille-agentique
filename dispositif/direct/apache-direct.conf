# PAPN en direct, derrière le même mot de passe que l'office.
ProxyPass        /direct/ http://127.0.0.1:8770/
ProxyPassReverse /direct/ http://127.0.0.1:8770/
RedirectMatch ^/direct$ /direct/
<Location "/direct/">
    AuthType Basic
    AuthName "PAPN en direct"
    AuthUserFile /etc/apache2/hermes-office.htpasswd
    Require valid-user
</Location>
